services:
  - type: web
    name: rally-court-club-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run db:generate && npm run db:deploy && npm run db:seed-if-empty && npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # SMTP2GO's TLS submission port works on a free Render web service.
      # The username, password, and sender must be entered privately in Render.
      - key: MAIL_HOST
        value: mail.smtp2go.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTPSecure
        value: "false"
      - key: MAIL_FROM
        sync: false
